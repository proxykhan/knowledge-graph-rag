<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 760" width="1220" height="760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
    <style>
      .step  { fill: #EEF4FF; stroke: #3B6FD8; stroke-width: 1.5; }
      .llm   { fill: #FFF4E5; stroke: #D98A1C; stroke-width: 1.5; }
      .check { fill: #EAF7EE; stroke: #2E8B57; stroke-width: 1.5; }
      .store { fill: #F3EEFF; stroke: #6B4FBB; stroke-width: 1.5; }
      .io    { fill: #F4F4F4; stroke: #555; stroke-width: 1.5; }
      .t     { font-size: 14px; font-weight: 600; fill: #1A1A1A; text-anchor: middle; }
      .s     { font-size: 12px; fill: #444; text-anchor: middle; }
      .lane  { font-size: 13px; font-weight: 700; fill: #6B6B6B; letter-spacing: 1.5px; }
      .lbl   { font-size: 12px; fill: #333; font-weight: 600; }
      .note  { font-size: 11.5px; fill: #666; font-style: italic; }
      .edge  { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .halo  { stroke: #FFFFFF; stroke-width: 7; fill: none; }
    </style>
  </defs>

  <!-- Solid card so the diagram stays legible on GitHub's dark theme -->
  <rect x="0" y="0" width="1220" height="760" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="40" y="44" font-size="20" font-weight="700" fill="#1A1A1A">Knowledge Graph RAG: data path</text>

  <!-- ============ INGESTION ============ -->
  <text x="40" y="84" class="lane">INGESTION · offline, once per filing</text>

  <rect x="40"   y="100" width="160" height="60" rx="8" class="io"/>
  <text x="120"  y="126" class="t">SEC EDGAR</text><text x="120" y="145" class="s">latest 10-K (HTML)</text>

  <rect x="230"  y="100" width="160" height="60" rx="8" class="step"/>
  <text x="310"  y="126" class="t">Parse sections</text><text x="310" y="145" class="s">Items 1 · 1A · 7</text>

  <rect x="420"  y="100" width="160" height="60" rx="8" class="step"/>
  <text x="500"  y="126" class="t">Chunk</text><text x="500" y="145" class="s">~3k chars · chunk_id</text>

  <rect x="615"  y="100" width="180" height="60" rx="8" class="llm"/>
  <text x="705"  y="126" class="t">LLM extraction</text><text x="705" y="145" class="s">4 chunks per request</text>

  <rect x="820"  y="100" width="160" height="60" rx="8" class="check"/>
  <text x="900"  y="126" class="t">Validate</text><text x="900" y="145" class="s">ontology · verbatim quote</text>

  <rect x="1000" y="100" width="180" height="60" rx="8" class="step"/>
  <text x="1090" y="126" class="t">Entity resolution</text><text x="1090" y="145" class="s">alias · acronym · embedding</text>

  <rect x="615"  y="190" width="180" height="60" rx="8" class="step"/>
  <text x="705"  y="216" class="t">Embed (local)</text><text x="705" y="235" class="s">bge-small + company header</text>

  <path d="M200,130 H228" class="edge"/>
  <path d="M390,130 H418" class="edge"/>
  <path d="M580,130 H613" class="edge"/>
  <path d="M795,130 H818" class="edge"/>
  <path d="M980,130 H998" class="edge"/>
  <path d="M500,160 V220 H613" class="edge"/>
  <path d="M705,250 V298" class="edge"/>
  <path d="M1090,160 V298" class="edge"/>
  <text x="1100" y="232" class="note" text-anchor="start">MERGE</text>

  <!-- ============ STORES ============ -->
  <text x="40" y="345" class="lane">STORES</text>
  <text x="40" y="364" class="note">shared key: chunk_id</text>

  <!-- pgvector cylinder -->
  <path d="M615,312 V372 A90,12 0 0 0 795,372 V312" class="store"/>
  <ellipse cx="705" cy="312" rx="90" ry="12" class="store"/>
  <text x="705" y="340" class="t">pgvector</text>
  <text x="705" y="358" class="s">HNSW · 404 chunks</text>
  <text x="705" y="373" class="s">entity ids per chunk</text>

  <!-- Neo4j cylinder -->
  <path d="M1000,312 V372 A90,12 0 0 0 1180,372 V312" class="store"/>
  <ellipse cx="1090" cy="312" rx="90" ry="12" class="store"/>
  <text x="1090" y="340" class="t">Neo4j</text>
  <text x="1090" y="358" class="s">424 entities · 454 facts</text>
  <text x="1090" y="373" class="s">chunk ids on every edge</text>

  <path d="M800,342 H995" stroke="#6B4FBB" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/>
  <text x="897" y="334" class="lbl" text-anchor="middle" fill="#6B4FBB">same chunk_id</text>
  <text x="897" y="360" class="note" text-anchor="middle">passage ⇄ graph neighbourhood</text>

  <!-- ============ QUERY ============ -->
  <text x="40" y="432" class="lane">QUERY · per question, FastAPI</text>

  <rect x="40"   y="450" width="150" height="60" rx="8" class="io"/>
  <text x="115"  y="476" class="t">Question</text><text x="115" y="495" class="s">POST /ask</text>

  <rect x="220"  y="450" width="200" height="60" rx="8" class="llm"/>
  <text x="320"  y="476" class="t">Router (light LLM call)</text><text x="320" y="495" class="s">route · confidence · hops</text>

  <rect x="615"  y="450" width="180" height="60" rx="8" class="step"/>
  <text x="705"  y="476" class="t">Vector search</text><text x="705" y="495" class="s">top 5 · ef_search 40</text>

  <rect x="1000" y="450" width="180" height="60" rx="8" class="step"/>
  <text x="1090" y="476" class="t">Graph query</text><text x="1090" y="495" class="s">link entities → Cypher template</text>

  <path d="M190,480 H218" class="edge"/>
  <path d="M420,480 H613" class="edge"/>
  <text x="517" y="472" class="lbl" text-anchor="middle">VECTOR</text>
  <path d="M320,510 V535 H1040 V512" class="edge"/>
  <text x="880" y="528" class="lbl" text-anchor="middle">GRAPH</text>
  <text x="330" y="553" class="note">confidence &lt; 0.7 → both</text>

  <!-- reads from the stores -->
  <path d="M705,384 V448" class="edge"/>
  <text x="713" y="422" class="note">HNSW</text>
  <path d="M1090,384 V448" class="edge"/>
  <text x="1082" y="422" class="note" text-anchor="end">parameters only, no model-written Cypher</text>

  <!-- vector results to context: drawn over a white halo where it crosses the GRAPH line -->
  <path d="M705,512 V565 H1060 V588" class="halo"/>
  <path d="M705,512 V565 H1060 V588" class="edge"/>
  <path d="M1140,510 V588" class="edge"/>
  <text x="1150" y="555" class="note" text-anchor="start">paths</text>
  <text x="725" y="582" class="note">passages</text>

  <rect x="1000" y="590" width="180" height="60" rx="8" class="step"/>
  <text x="1090" y="616" class="t">Context builder</text><text x="1090" y="635" class="s">facts as sentences · source ids</text>

  <rect x="770"  y="590" width="180" height="60" rx="8" class="llm"/>
  <text x="860"  y="616" class="t">Answer (LLM call)</text><text x="860" y="635" class="s">claims + citations, or refuse</text>

  <rect x="540"  y="590" width="180" height="60" rx="8" class="check"/>
  <text x="630"  y="616" class="t">Citation check</text><text x="630" y="635" class="s">id retrieved? number in source?</text>

  <rect x="310"  y="590" width="180" height="60" rx="8" class="io"/>
  <text x="400"  y="616" class="t">Cited answer</text><text x="400" y="635" class="s">GET /chunks/{id} opens sources</text>

  <path d="M1000,620 H952" class="edge"/>
  <path d="M770,620 H722" class="edge"/>
  <path d="M540,620 H492" class="edge"/>

  <!-- reject loop -->
  <path d="M630,650 V675 H860 V652" stroke="#C0392B" stroke-width="1.6" fill="none" marker-end="url(#arrow-red)"/>
  <text x="745" y="692" font-size="12" fill="#C0392B" font-weight="600" text-anchor="middle">reject → regenerate (max 3)</text>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(40,720)">
    <rect x="0"   y="-12" width="18" height="14" rx="3" class="llm"/>   <text x="26"  y="0" font-size="12" fill="#333">LLM call (Gemini Flash-Lite)</text>
    <rect x="230" y="-12" width="18" height="14" rx="3" class="check"/> <text x="256" y="0" font-size="12" fill="#333">deterministic check</text>
    <rect x="410" y="-12" width="18" height="14" rx="3" class="store"/> <text x="436" y="0" font-size="12" fill="#333">store</text>
    <rect x="500" y="-12" width="18" height="14" rx="3" class="step"/>  <text x="526" y="0" font-size="12" fill="#333">processing step</text>
    <rect x="660" y="-12" width="18" height="14" rx="3" class="io"/>    <text x="686" y="0" font-size="12" fill="#333">input / output</text>
  </g>
</svg>
